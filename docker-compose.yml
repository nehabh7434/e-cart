services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ecart}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env or the environment}
      POSTGRES_DB: ${DB_NAME:-ecart}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./DDL.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./data.sql:/docker-entrypoint-initdb.d/02-products.sql:ro

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER:-ecart}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-ecart}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env or the environment}
      DB_PORT: 5432
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env or the environment}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NODE_ENV: development
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  postgres-data:
